[project]
name = "voice-bot"
version = "0.1.0"
description = "Voice telephone chatbot for restaurant reservations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pipecat-ai[daily,deepgram,anthropic,elevenlabs]>=0.0.100",  # [daily] includes Daily.co transport support
    "twilio>=9.0.0",
    "deepgram-sdk>=3.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "elevenlabs>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "redis>=5.0.0",
    "silero-vad>=4.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
]
